name: Backend CI

on:
  push:
    branches: [main]
    paths: ['telecomIQ_backend/**']
  pull_request:
    branches: [main]
    paths: ['telecomIQ_backend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests -B
        working-directory: telecomIQ_backend

      - name: Run Tests
        run: mvn test -B
        working-directory: telecomIQ_backend

      - name: Build Docker Image
        run: docker build -f docker/backend.Dockerfile -t telecomiq-backend:${{ github.sha }} ./telecomIQ_backend

