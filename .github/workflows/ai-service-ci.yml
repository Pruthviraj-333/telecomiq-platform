name: AI Service CI

on:
  push:
    branches: [main]
    paths: ['telecomIQ_ai_service/**']
  pull_request:
    branches: [main]
    paths: ['telecomIQ_ai_service/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: telecomIQ_ai_service/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt
        working-directory: telecomIQ_ai_service

      - name: Dependency Security Check
        run: pip audit || true
        working-directory: telecomIQ_ai_service

      - name: Build Docker Image
        run: docker build -f telecomIQ_ai_service/Dockerfile -t telecomiq-ai:${{ github.sha }} ./telecomIQ_ai_service

