spring:
  application:
    name: telecomiq-backend

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telecomiq}
    username: ${DB_USERNAME:telecomiq_user}
    password: ${DB_PASSWORD:telecomiq_pass_2024}
    driver-class-name: org.postgresql.Driver

  # Mail (Gmail SMTP)
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Server
server:
  port: 8080
  servlet:
    context-path: /

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:default-secret-key-change-in-production-min-32-characters-long}
    expiration: ${JWT_EXPIRATION:86400000}

  # AI Service
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}

  # Email
  mail:
    from: ${SMTP_FROM:noreply@telecomiq.com}
    enabled: ${MAIL_ENABLED:true}

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Logging
logging:
  level:
    com.telecomiq: INFO
    org.springframework.security: WARN

# Actuator Health Indicators Configuration
management:
  health:
    mail:
      enabled: false
